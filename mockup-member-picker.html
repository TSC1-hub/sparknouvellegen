<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK — Mockup Sélecteur Membre TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --moss:#3d5c3a;--sage:#5a7a5a;--leaf:#7ab648;
  --warm:#faf7f2;--terra:#d4694a;--sun:#f0c040;
  --text:#2c3a28;--mid:#5a6b54;--light:#8fa085;
  --bg:#e8e2d0;--border:rgba(44,58,40,0.12);--shadow:rgba(44,58,40,0.08);
}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 80% 10%,rgba(122,182,72,.07) 0%,transparent 60%),
    radial-gradient(ellipse 40% 60% at 10% 90%,rgba(139,99,71,.05) 0%,transparent 60%);}

/* ── HEADER ── */
.app-header{position:relative;z-index:20;padding:0 20px;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--moss);box-shadow:0 2px 16px rgba(0,0,0,.15);flex-shrink:0;}
.h-logo{font-family:'Fraunces',serif;font-weight:900;font-size:1.3rem;letter-spacing:1px;
  color:var(--sun);display:flex;align-items:center;gap:8px;}
.h-logo-sub{font-size:.62rem;font-style:italic;font-weight:400;opacity:.4;margin-left:2px;}
.h-pill{display:flex;align-items:center;gap:7px;border-radius:20px;padding:5px 14px;
  background:rgba(245,240,232,.1);border:1px solid rgba(245,240,232,.18);
  color:rgba(245,240,232,.75);font-size:.7rem;font-weight:500;}
.h-av{width:24px;height:24px;border-radius:7px;background:var(--terra);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;}
.btn-logout{padding:4px 12px;background:transparent;border:1px solid rgba(255,255,255,.15);
  border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.65rem;
  color:rgba(255,255,255,.4);cursor:pointer;margin-left:10px;}

/* ── WORKSPACE ── */
.eleve-workspace{flex:1;display:flex;overflow:hidden;}

/* ── STEPS SIDEBAR ── */
.steps-sidebar{width:96px;background:white;display:flex;flex-direction:column;
  flex-shrink:0;border-right:1px solid #f0f0f0;overflow-y:auto;
  justify-content:space-evenly;padding-bottom:8px;}
.ss-title{font-size:.48rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#bbb;padding:12px 4px 6px;text-align:center;}
.step-item{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:6px 4px;cursor:pointer;border-radius:12px;transition:background .18s;width:88px;}
.step-item:hover{background:#f5f5f5;}
.step-item.locked{opacity:.52;}
.step-orb{width:50px;height:50px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:#e0e0e0;position:relative;font-size:1.3rem;}
.step-item.done .step-orb{background:linear-gradient(135deg,#00d4a0,#05b78f);}
.step-item.active .step-orb{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366);padding:2.5px;}
.step-ring-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;}
.step-item.active .step-ring-inner{background:white;}
.step-emoji{font-size:1.3rem;}
.step-label{font-size:.48rem;font-weight:600;color:#888;text-align:center;margin-top:2px;line-height:1.3;}
.step-item.active .step-label{color:#1a1a2e;font-weight:700;}
.step-item.done .step-label{color:#009978;font-weight:600;}
.step-num{font-size:.46rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  padding:1px 6px;border-radius:999px;background:#f0f0f0;color:#aaa;margin-bottom:1px;}
.step-item.done .step-num{background:rgba(0,212,160,.12);color:#009978;}
.step-item.active .step-num{background:#f0f0f0;color:#1a1a2e;}

/* ── MAIN CONV ── */
.conv-area{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 0;}
.conv-etape-header{font-size:.57rem;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--sage);padding:0 0 10px;display:flex;align-items:center;gap:6px;}

/* Messages */
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.messages::-webkit-scrollbar{width:3px;}
.messages::-webkit-scrollbar-thumb{background:rgba(90,122,90,.25);border-radius:2px;}
.msg{display:flex;gap:9px;max-width:85%;animation:msgIn .3s ease-out;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg.spark-msg{align-self:flex-start;}
.msg.eleve-msg{align-self:flex-end;flex-direction:row-reverse;}
.msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;}
.msg.spark-msg .msg-av{background:var(--moss);}
.msg.eleve-msg .msg-av{background:var(--terra);}
.msg-col{display:flex;flex-direction:column;gap:2px;}
.msg-who{font-size:.6rem;font-weight:600;padding:0 4px;}
.msg.spark-msg .msg-who{color:var(--sage);}
.msg.eleve-msg .msg-who{text-align:right;color:var(--terra);}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:.83rem;line-height:1.65;}
.msg.spark-msg .msg-bubble{background:white;border:1px solid var(--border);color:var(--text);
  border-bottom-left-radius:4px;box-shadow:0 2px 8px var(--shadow);}
.msg.eleve-msg .msg-bubble{background:linear-gradient(135deg,var(--terra),#c4504a);
  color:white;border-bottom-right-radius:4px;}
.typing-bubble{display:flex;align-items:center;gap:5px;padding:10px 14px;
  background:white;border:1px solid var(--border);border-radius:16px;
  border-bottom-left-radius:4px;box-shadow:0 2px 8px var(--shadow);}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--light);}
.typing-dot:nth-child(1){animation:typing .9s ease-in-out infinite;}
.typing-dot:nth-child(2){animation:typing .9s ease-in-out .2s infinite;}
.typing-dot:nth-child(3){animation:typing .9s ease-in-out .4s infinite;}
@keyframes typing{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-5px);opacity:1;}}

/* ── INPUT ZONE ── */
.input-zone{display:flex;flex-direction:column;gap:7px;flex-shrink:0;padding-bottom:14px;}

/* ══ MEMBER PICKER BAR — NOUVEAU ══ */
.mbr-bar{
  display:flex;align-items:center;gap:8px;
  background:white;border:1.5px solid var(--border);
  border-radius:14px;padding:7px 12px;
  box-shadow:0 2px 8px var(--shadow);
  transition:border-color .2s;
}
.mbr-bar-lbl{font-size:.57rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--light);white-space:nowrap;flex-shrink:0;}
.mbr-pills{display:flex;gap:5px;flex-wrap:wrap;}
.mbr-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--warm);
  color:var(--mid);font-size:.67rem;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .18s;white-space:nowrap;
}
.mbr-pill:hover{border-color:rgba(212,105,74,.35);color:var(--terra);}
.mbr-pill.on{
  background:linear-gradient(135deg,var(--terra),#c4504a);
  border-color:var(--terra);color:white;
  box-shadow:0 2px 8px rgba(212,105,74,.25);
}
.mbr-pill .mp-av{
  width:16px;height:16px;border-radius:5px;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:800;flex-shrink:0;
}
.mbr-pill:not(.on) .mp-av{background:rgba(212,105,74,.12);color:var(--terra);}
.mbr-live-dot{
  width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0;
  animation:pulse-live 1.4s ease-in-out infinite;
}
@keyframes pulse-live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.mbr-separator{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 2px;}

/* Speaker avatar dans les bulles élève — badge nom superposé */
.msg.eleve-msg .msg-av{position:relative;}
.spk-badge{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  background:var(--terra);border:1.5px solid white;
  border-radius:5px;padding:0 5px;
  font-size:.42rem;font-weight:800;color:white;
  white-space:nowrap;line-height:1.5;
}

/* Modes SPARK */
.spark-mode-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:0 2px 2px;}
.spark-mode-lbl{font-size:.53rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--light);margin-right:2px;white-space:nowrap;}
.spark-mbtn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--border);background:var(--warm);font-size:.61rem;font-weight:600;
  color:var(--mid);cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;}
.spark-mbtn:hover{background:rgba(122,182,72,.1);border-color:rgba(122,182,72,.35);color:var(--moss);}
.spark-mbtn.active{background:var(--moss);border-color:var(--moss);color:white;}

.input-row{display:flex;gap:8px;align-items:flex-end;background:white;border:1.5px solid var(--border);
  border-radius:16px;padding:9px 10px;box-shadow:0 2px 8px var(--shadow);transition:border-color .2s;}
.input-row:focus-within{border-color:rgba(61,92,58,.25);}
.msg-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.83rem;resize:none;min-height:42px;max-height:120px;line-height:1.55;}
.msg-input::placeholder{color:var(--light);}
.btn-send{background:var(--moss);border:none;border-radius:12px;padding:10px 18px;color:white;
  font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;
  transition:all .2s;white-space:nowrap;flex-shrink:0;}
.btn-send:hover{background:var(--sage);transform:translateY(-1px);}

/* ── ONBOARDING STATE INDICATORS ── */
.onboard-badge{
  align-self:center;
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 14px;border-radius:999px;
  background:rgba(240,192,64,.12);border:1px solid rgba(240,192,64,.3);
  font-size:.63rem;font-weight:700;color:#7a5c00;margin:0 auto;
}
.phase-dot{width:7px;height:7px;border-radius:50%;background:var(--sun);}

/* ── VUE STATES TABS ── */
.state-switcher{
  position:fixed;bottom:20px;right:20px;z-index:999;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;
}
.sw-lbl{font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:white;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:999px;text-align:right;}
.sw-btn{padding:6px 14px;border-radius:999px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;
  transition:all .18s;white-space:nowrap;}
.sw-btn.on{background:var(--terra);color:white;box-shadow:0 4px 14px rgba(212,105,74,.35);}
.sw-btn:not(.on){background:rgba(255,255,255,.85);color:var(--mid);}
.sw-btn:hover:not(.on){background:white;}

/* ─ annotation bubbles ─ */
.annot{
  position:absolute;z-index:50;
  background:#0a1929;color:#93c5e8;
  font-size:.67rem;line-height:1.45;padding:7px 11px;border-radius:10px;
  border:1px solid rgba(29,111,164,.3);max-width:220px;pointer-events:none;
}
.annot::before{content:'';position:absolute;width:8px;height:8px;
  background:#0a1929;border:1px solid rgba(29,111,164,.3);transform:rotate(45deg);}
.annot.arrow-down::before{bottom:-5px;left:50%;margin-left:-4px;border-top:none;border-left:none;}
.annot.arrow-left::before{left:-5px;top:50%;margin-top:-4px;border-right:none;border-top:none;}
.annot.arrow-up::before{top:-5px;left:50%;margin-left:-4px;border-bottom:none;border-right:none;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="h-logo">⚡ SPARK <span class="h-logo-sub">Nouvelle Génération</span></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="h-pill"><div class="h-av">🐉</div><span id="pill-txt">FRT50 · Forêt 2050</span></div>
    <button class="btn-logout">↩ Quitter</button>
  </div>
</div>

<div class="eleve-workspace">

  <!-- ── STEPS SIDEBAR ── -->
  <div class="steps-sidebar">
    <div class="ss-title">JOURNEY</div>
    <div class="step-item done">
      <span class="step-num">ÉTAPE 0</span>
      <div class="step-orb"><div class="step-ring-inner"><span class="step-emoji">🌱</span></div></div>
      <span class="step-label">Découvrir</span>
    </div>
    <div class="step-item active">
      <span class="step-num">ÉTAPE 1</span>
      <div class="step-orb" id="step-orb-1"><div class="step-ring-inner"><span class="step-emoji">🔍</span></div></div>
      <span class="step-label">Problématiser</span>
    </div>
    <div class="step-item locked">
      <span class="step-num">ÉTAPE 2</span>
      <div class="step-orb"><div class="step-ring-inner"><span class="step-emoji">✏️</span></div></div>
      <span class="step-label">Imaginer</span>
    </div>
    <div class="step-item locked">
      <span class="step-num">ÉTAPE 3</span>
      <div class="step-orb"><div class="step-ring-inner"><span class="step-emoji">🔨</span></div></div>
      <span class="step-label">Créer</span>
    </div>
    <div class="step-item locked">
      <span class="step-num">ÉTAPE 4</span>
      <div class="step-orb"><div class="step-ring-inner"><span class="step-emoji">📢</span></div></div>
      <span class="step-label">Pitcher</span>
    </div>
    <div class="step-item locked">
      <span class="step-num">ÉTAPE 5</span>
      <div class="step-orb"><div class="step-ring-inner"><span class="step-emoji">🏆</span></div></div>
      <span class="step-label">Finale</span>
    </div>
  </div>

  <!-- ── CONV AREA ── -->
  <div class="conv-area" style="position:relative;">
    <div class="conv-etape-header" id="conv-header">Étape 1 — Problématiser</div>

    <!-- MESSAGES -->
    <div class="messages" id="chat-messages"></div>

    <!-- INPUT ZONE -->
    <div class="input-zone" id="input-zone">
      <!-- Modes (masqués pendant onboarding) -->
      <div class="spark-mode-bar" id="spark-mode-bar" style="display:none">
        <span class="spark-mode-lbl">Mode</span>
        <div class="spark-mbtn">🔬 Science</div>
        <div class="spark-mbtn active">💥 Challenge</div>
        <div class="spark-mbtn">📄 Analyse</div>
        <div class="spark-mbtn">⚖️ Jury</div>
      </div>
      <!-- MEMBER PICKER BAR -->
      <div class="mbr-bar" id="mbr-bar" style="display:none">
        <span class="mbr-bar-lbl">✏️ Qui tape ?</span>
        <div class="mbr-pills" id="mbr-pills"></div>
        <div class="mbr-separator"></div>
        <div class="mbr-live-dot" id="mbr-live-dot"></div>
        <span id="mbr-live-name" style="font-size:.62rem;font-weight:700;color:var(--sage)">Léa</span>
      </div>
      <div class="input-row" id="input-row">
        <textarea class="msg-input" id="msg-input" placeholder="Tapez votre message..." rows="1"
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="btn-send" id="btn-send" onclick="sendMsg()">Envoyer 🌱</button>
      </div>
    </div>
  </div>

</div>

<!-- State switcher (démo) -->
<div class="state-switcher">
  <span class="sw-lbl">DÉMO — état</span>
  <button class="sw-btn on" onclick="showState(this,'welcome')">① Bienvenue</button>
  <button class="sw-btn" onclick="showState(this,'nb')">② Combien ?</button>
  <button class="sw-btn" onclick="showState(this,'names')">③ Pseudos</button>
  <button class="sw-btn" onclick="showState(this,'chat')">④ Chat normal</button>
</div>

<script src="spark-guided-tour.js"></script>
<script>
/* ══════════════════ DATA ══════════════════ */
const TEAM_MEMBER = { id:'team', init:'', name:'Team', emoji:'👥' };
const MEMBERS = [
  { id:'lea',   init:'L', name:'Léa',   emoji:'🌿' },
  { id:'tom',   init:'T', name:'Tom',   emoji:'🔥' },
  { id:'amira', init:'A', name:'Amira', emoji:'💧' },
  { id:'jules', init:'J', name:'Jules', emoji:'⚡' },
];
let _currentMembers = [TEAM_MEMBER, ...MEMBERS];
let currentSpeaker = TEAM_MEMBER;
let _onboardingPhase = 'awaiting_ready'; // awaiting_ready | awaiting_nb | awaiting_names | done
let _nbMembres = 0;
let _collectedNames = [];

/* ══════════════════ MESSAGES ══════════════════ */
const msgs = document.getElementById('chat-messages');

function bubble(role, text, who, speakerMember) {
  const cls = role === 'spark' ? 'spark-msg' : 'eleve-msg';
  const av  = role === 'spark' ? '⚡' : (speakerMember?.emoji || '🐉');
  const avColor = role === 'spark' ? '' : `background:${memberColor(speakerMember?.id)}`;
  const badge = (role === 'eleve' && speakerMember?.init)
    ? `<div class="spk-badge">${speakerMember.init}</div>` : '';
  const d = document.createElement('div');
  d.className = `msg ${cls}`;
  d.innerHTML = `
    <div class="msg-av" style="${avColor};position:relative">${av}${badge}</div>
    <div class="msg-col">
      <span class="msg-who">${who}</span>
      <div class="msg-bubble">${text}</div>
    </div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function memberColor(id) {
  const map = { lea:'#d4694a', tom:'#e6683c', amira:'#5a7a5a', jules:'#3d5c3a', team:'var(--moss)' };
  return map[id] || 'var(--terra)';
}

function showTyping() {
  const d = document.createElement('div');
  d.id = 'typing';
  d.className = 'msg spark-msg';
  d.innerHTML = `<div class="msg-av" style="background:var(--moss)">⚡</div>
    <div class="msg-col">
      <span class="msg-who">SPARK ⚡</span>
      <div class="typing-bubble">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

/* ══════════════════ STATES (démo) ══════════════════ */
function showState(btn, state) {
  document.querySelectorAll('.sw-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  msgs.innerHTML = '';
  // Fermer le tour guidé si actif (mode démo — évite les conflits de phase)
  ['gt-overlay','gt-spotlight','gt-arrow','gt-card','gt-styles'].forEach(id => {
    document.getElementById(id)?.remove();
  });
  document.getElementById('mbr-bar').style.display = 'none';
  document.getElementById('spark-mode-bar').style.display = 'none';
  document.getElementById('msg-input').placeholder = 'Tapez votre message...';
  document.getElementById('msg-input').disabled = false;

  if (state === 'welcome') {
    _onboardingPhase = 'awaiting_ready';
    bubble('spark',
      `<em>« Bienvenue dans le programme The Schools Challenge, vous êtes la 10ème génération à découvrir ce programme ! 🥳 Vous allez lors des 6 prochains mois collaborer tous.tes ensemble dans la résolution d'un problème ! Êtes-vous prêt.e.s ? 💪 »</em><br><br><span style="color:var(--light);font-style:italic">*(Je reste sur cette action tant que je n'ai pas une réponse positive, même courte comme "Oui" !)* 😊</span>`,
      'SPARK ⚡');
  }

  if (state === 'nb') {
    _onboardingPhase = 'awaiting_nb';
    bubble('spark',
      "Avant de commencer l'aventure The Schools Challenge — vous êtes <strong>combien</strong> dans votre équipe ? 👥",
      'SPARK ⚡');
  }

  if (state === 'names') {
    _onboardingPhase = 'awaiting_names';
    _nbMembres = 4;
    bubble('spark', "Avant de commencer l'aventure The Schools Challenge — vous êtes <strong>combien</strong> dans votre équipe ? 👥", 'SPARK ⚡');
    setTimeout(() => bubble('eleve', "4", 'La Team', TEAM_MEMBER), 500);
    setTimeout(() => {
      bubble('spark',
        "Super, une équipe de 4 ! 🙌 Donnez-moi les <strong>4 prénoms ou pseudos</strong> de votre équipe — séparés par des virgules ou un par message !",
        'SPARK ⚡');
    }, 1100);
  }

  if (state === 'chat') {
    _onboardingPhase = 'done';
    renderMemberPicker(MEMBERS);
    document.getElementById('spark-mode-bar').style.display = 'flex';
    bubble('spark',
      "Léa, bonne question sur la déforestation 🌲 — maintenant essaie de formuler <strong>en quoi ça touche directement les habitants</strong> de la zone. C'est ça qu'un jury voudra entendre.",
      'SPARK ⚡');
    setTimeout(() => {
      bubble('eleve',
        "hmm ouais genre les gens qui vivent là-bas perdent leurs ressources ?",
        'Tom · Team', MEMBERS.find(m => m.id === 'tom'));
      setSpeaker('tom', false);
    }, 500);
    setTimeout(() => {
      bubble('spark',
        "Exactement Tom 🎯 Et qui <em>d'autre</em> est impacté en dehors des habitants locaux ? Pense à plus grande échelle...",
        'SPARK ⚡');
    }, 1100);
    setTimeout(() => {
      bubble('eleve',
        "Le climat global parce que les forêts absorbent le CO₂ !",
        'Léa · Team', MEMBERS.find(m => m.id === 'lea'));
      setSpeaker('lea', false);
    }, 1700);
    setTimeout(() => {
      bubble('spark',
        "Parfait Léa 🚀 Vous avez les deux angles — local ET global. C'est une vraie problématique. <strong>Comment vous les reliez dans votre projet ?</strong>",
        'SPARK ⚡');
    }, 2400);
  }
}

/* ══════════════════ MEMBER PICKER ══════════════════ */
function renderMemberPicker(members) {
  const bar = document.getElementById('mbr-bar');
  const pills = document.getElementById('mbr-pills');
  bar.style.display = 'flex';
  _currentMembers = [TEAM_MEMBER, ...members];
  pills.innerHTML = _currentMembers.map((m, i) =>
    `<button class="mbr-pill ${i === 0 ? 'on' : ''}" onclick="setSpeaker('${m.id}', true)" id="pill-${m.id}">
      <span class="mp-av">${m.init || m.emoji}</span>${m.name}
    </button>`
  ).join('');
  setSpeaker('team', false);
}

function setSpeaker(id, focus) {
  const m = _currentMembers.find(x => x.id === id);
  if (!m) return;
  currentSpeaker = m;
  document.querySelectorAll('.mbr-pill').forEach(b => b.classList.remove('on'));
  const pill = document.getElementById('pill-' + id);
  if (pill) pill.classList.add('on');
  document.getElementById('mbr-live-name').textContent = m.name;
  const inp = document.getElementById('msg-input');
  inp.placeholder = m.id === 'team' ? 'La Team écrit à SPARK…' : `${m.name} écrit à SPARK…`;
  if (focus) inp.focus();
}

/* ══════════════════ SEND ══════════════════ */
function sendMsg() {
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';

  // Pendant le tour guidé — réponse générique, ne déclenche PAS l'onboarding
  if (_onboardingPhase === 'tour') {
    bubble('eleve', txt, 'La Team', TEAM_MEMBER);
    showTyping();
    setTimeout(() => {
      hideTyping();
      const tourReplies = [
        "Super ! Je vois que vous avez déjà des idées 🌱 C'est exactement comme ça que ça marche — posez-moi vos questions et on avance ensemble.",
        "Intéressant ! SPARK est là pour vous aider à structurer vos idées et challenger votre projet 🎯",
        "Bien reçu ! Au cours des prochaines étapes, vous pourrez me poser toutes vos questions 🔍",
        "Parfait ! Vous verrez, ensemble on va construire quelque chose de fort 💪",
      ];
      bubble('spark', tourReplies[Math.floor(Math.random() * tourReplies.length)], 'SPARK ⚡');
    }, 800 + Math.random() * 600);
    return;
  }

  if (_onboardingPhase === 'awaiting_ready') {
    bubble('eleve', txt, 'La Team', TEAM_MEMBER);
    const lower = txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const isNeg = /\bnon\b|pas (sur|sûr|vraiment|encore)|peut.tre|bof|sais pas|pas pr[eê]t/i.test(lower);
    if (isNeg) {
      // Réponse négative → rester en awaiting_ready et encourager
      showTyping();
      setTimeout(() => {
        hideTyping();
        bubble('spark', "Pas d'inquiétude, SPARK est là pour vous guider pas à pas ! 😊 Prenez votre temps — quand vous êtes prêt.e.s, dites-le moi 💪", 'SPARK ⚡');
      }, 700);
      return;
    }
    // Réponse positive ou neutre → avancer
    _onboardingPhase = 'awaiting_nb';
    const isExcited = /!|genial|génial|trop (bien|cool|top)|grave|hyper|waoh|yeah/i.test(lower);
    const prefix = isExcited ? "Waoh, l'énergie est là ! 🔥 " : "";
    showTyping();
    setTimeout(() => { hideTyping(); bubble('spark', `${prefix}Avant de commencer — vous êtes <strong>combien</strong> dans votre équipe ? 👥`, 'SPARK ⚡'); }, 700);
    return;
  }

  if (_onboardingPhase === 'awaiting_nb') {
    const textNums = {'un':1,'une':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,'neuf':9,'dix':10};
    const lowerNb = txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let n = parseInt(txt.match(/\d+/)?.[0]);
    if (isNaN(n)) {
      for (const [word, val] of Object.entries(textNums)) {
        if (lowerNb === word || new RegExp('\\b' + word + '\\b').test(lowerNb)) { n = val; break; }
      }
    }
    bubble('eleve', txt, 'La Team', TEAM_MEMBER);
    if (n >= 1 && n <= 10) {
      _nbMembres = n;
      _onboardingPhase = 'awaiting_names';
      showTyping();
      setTimeout(() => {
        hideTyping();
        const noms = n === 1 ? 'ton prénom ou pseudo !' : `les ${n} prénoms ou pseudos de votre équipe, séparés par des virgules !`;
        bubble('spark', `Super, une équipe de ${n} ! 🙌 Donnez-moi ${noms}`, 'SPARK ⚡');
      }, 700);
    } else {
      showTyping();
      setTimeout(() => {
        hideTyping();
        bubble('spark', "Je n'ai pas bien compris — donnez-moi un nombre entre 1 et 10 🙂", 'SPARK ⚡');
      }, 500);
    }
    return;
  }

  if (_onboardingPhase === 'awaiting_names') {
    bubble('eleve', txt, 'La Team', TEAM_MEMBER);
    const parsed = txt.split(/[,\n\/;]+/).map(s => s.trim()).filter(Boolean);
    _collectedNames.push(...parsed);
    if (_collectedNames.length >= _nbMembres) {
      const names = _collectedNames.slice(0, _nbMembres);
      const dynamicMembers = names.map((name, i) => ({
        id: name.toLowerCase().replace(/\s+/g,'_') + '_' + i,
        init: name.charAt(0).toUpperCase(),
        name,
        emoji: ['🌿','🔥','💧','⚡','🌻','🧬','☀️','🔬'][i % 8]
      }));
      _onboardingPhase = 'done';
      _collectedNames = [];
      showTyping();
      setTimeout(() => {
        hideTyping();
        const listStr = names.slice(0,-1).join(', ') + (names.length > 1 ? ' et ' + names[names.length-1] : names[0]);
        bubble('spark',
          `Bienvenue dans le programme The Schools Challenge, vous êtes la 10ème génération à découvrir ce programme ! 🥳 Vous allez lors des 6 prochains mois collaborer tous.tes ensemble dans la résolution d'un problème ! Êtes-vous prêt.e.s ${listStr} ? 💪`,
          'SPARK ⚡');
        setTimeout(() => {
          renderMemberPicker(dynamicMembers);
          document.getElementById('spark-mode-bar').style.display = 'flex';
        }, 900);
      }, 800);
    } else {
      const reste = _nbMembres - _collectedNames.length;
      showTyping();
      setTimeout(() => {
        hideTyping();
        bubble('spark', `👍 J'en ai ${_collectedNames.length} — encore ${reste} prénom${reste > 1 ? 's' : ''} !`, 'SPARK ⚡');
      }, 500);
    }
    return;
  }

  // Chat normal
  const isTeam = !currentSpeaker || currentSpeaker.id === 'team';
  const who    = isTeam ? 'La Team' : `${currentSpeaker.name} · Team`;
  const spk    = isTeam ? TEAM_MEMBER : currentSpeaker;
  bubble('eleve', txt, who, spk);
  showTyping();
  setTimeout(() => {
    hideTyping();
    const spkName = isTeam ? '' : currentSpeaker.name;
    const replies = [
      `Bonne piste${spkName ? ' ' + spkName : ''} 🎯 — comment vous creusez ça ?`,
      `Intéressant ! Et quel impact concret est-ce que ça aurait sur le problème ? 🔍`,
      `Je vous challenge : est-ce que quelqu'un dans l'équipe voit un angle opposé ? 💥`,
      spkName ? `${spkName}, tu peux reformuler en partant de <em>"Le problème c'est que…"</em> ?` : `Pouvez-vous reformuler en partant de <em>"Le problème c'est que…"</em> ?`,
    ];
    bubble('spark', replies[Math.floor(Math.random() * replies.length)], 'SPARK ⚡');
  }, 800 + Math.random() * 700);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}
function autoResize(el) {
  el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px';
}

/* ── Init ── */
_onboardingPhase = 'tour';

// Appelé quand le tour se termine (bouton "C'est parti !" ou "Passer")
window.SparkTourOnEnd = function() {
  msgs.innerHTML = '';
  _onboardingPhase = 'awaiting_ready';
  _nbMembres = 0;
  _collectedNames = [];
  setTimeout(() => {
    bubble('spark',
      `<em>« Bienvenue dans le programme The Schools Challenge, vous êtes la 10ème génération à découvrir ce programme ! 🥳 Vous allez lors des 6 prochains mois collaborer tous.tes ensemble dans la résolution d'un problème ! Êtes-vous prêt.e.s ? 💪 »</em><br><br><span style="color:var(--light);font-style:italic">*(Je reste sur cette action tant que je n'ai pas une réponse positive, même courte comme "Oui" !)* 😊</span>`,
      'SPARK ⚡');
  }, 300);
};

// Lancer le tour si disponible, sinon aller directement à l'onboarding
if (typeof SparkTour !== 'undefined') {
  SparkTour.start();
} else {
  window.SparkTourOnEnd();
}
</script>
